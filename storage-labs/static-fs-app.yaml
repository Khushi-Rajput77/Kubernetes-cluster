apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: static-pvc-fs
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: static-local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: static-writer
spec:
  containers:
  - name: app
    image: busybox
    command: ["sh","-c","echo static-data >> /data/hello.txt; sleep 3600"]
    volumeMounts:
    - name: vol
      mountPath: /data
  volumes:
  - name: vol
    persistentVolumeClaim:
      claimName: static-pvc-fs
